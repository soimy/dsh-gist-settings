name: Release

# CONTRIBUTING.md's release steps end with "Tag `vX.Y.Z` and push the tag; the
# GitHub release is generated from the changelog section". This is what generates
# it — until now that step described automation that did not exist.
#
# It validates before it publishes. The common mistake is tagging before the
# version bump merged, which would ship a release whose notes and package version
# contradict the tag; `scripts/release-notes.ts` refuses that, and writes nothing
# to stdout when it refuses, so a failure cannot publish empty notes.
#
# `npm test` runs here with a real Harness installed, exactly as the CI `schema` job
# does, rather than with the skip the platform matrix uses. Without it this job would
# have died in `test/schema.test.ts` — before it published anything — on the first
# tag anybody pushed.
#
# The Node version is the floor `engines` names, which is the Harness's own floor:
# `@deepseek-harness-tui/dsh-tui` declares `engines: ^22.19 || >=24`. This job
# originally pinned 20.3.0 and failed on the first tag, because npm 9 — which 20.3
# bundles — resolved the Harness's tree to nine packages instead of five hundred and
# the tools the contract needs were never installed. The failure looked like a test
# failure; it was an unsupported runtime.
#
# Actions are pinned to commit SHAs rather than to `@v4` tags: this job holds
# `contents: write`, so a repointed tag would run with release-writing rights.

on:
  push:
    tags: ['v*']

# Only the release needs to write; everything else is read.
permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # Nothing here pushes, and the release job installs an external dependency tree
          # afterwards: do not leave the checkout token in the local git config.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.4
        with:
          node-version: '22.19.0'
      - uses: ./.github/actions/install-harness

      # Exactly what CI runs, on the commit the tag points at — including the schema
      # contract, which has a Harness to run against here. The type check is part of that
      # set: `npm test` builds the runtime without checking the suites or the scripts, so
      # without it a tag could publish a commit that CI's own `typecheck` job rejects.
      - name: Offline suites and repository checks
        run: npm test

      - name: Type-check the whole repository
        run: npm run typecheck

      - name: Generate the notes from the changelog section
        run: node scripts/release-notes.ts "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag