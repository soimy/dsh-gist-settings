name: CI

# The offline suites need no credentials: every `gh` call in them goes to
# `test/fake-gh.ts`, and neither the plugin nor its tests import anything outside
# `node:`. The `suites` job therefore runs exactly the command a contributor runs,
# on every platform and Node version the plugin claims to support — which matters
# here, because the code takes a different path on each: case folding and reserved
# device names on Windows, Unicode normalisation on macOS, rename-over-a-file
# semantics everywhere.
#
# The live suite is deliberately absent. It talks to the real GitHub API and
# creates gists, so running it needs a `gist`-scoped token and a decision to spend
# it — not a push. Run it locally with `npm run test:live`.
#
# Actions are pinned to commit SHAs rather than to `@v4` tags: a tag is mutable, and
# a repointed one would run inside this repository's token on the next push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref makes the previous run's answer stale.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # A failure on one platform is the interesting case, so let the other legs
      # finish rather than cancelling them and hiding which platforms disagree.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.x', '24.x']
        include:
          # A major-version alias only installs the newest release of that major, so
          # it would never notice something that arrived in the middle of one. This
          # leg runs the floor `engines` actually names.
          #
          # The floor is the Harness's, not the plugin's: the sync engine's own code
          # would run on 20.3 (it is `AbortSignal.any`), but nothing can load this
          # plugin without a Harness, and `@deepseek-harness-tui/dsh-tui` declares
          # `engines: ^22.19 || >=24`. Promising a version the platform cannot run is
          # worse than promising a narrower one, so the narrower one is the promise.
          - os: ubuntu-latest
            node: '22.19.0'
    env:
      # `test/schema.test.ts` fails rather than skipping when it cannot find an
      # installed Harness, and that is deliberate: a contract check that quietly
      # runs nothing reads as coverage. These legs do not install one — that is
      # hundreds of packages each, to re-prove what the `schema` job below proves
      # once per declared version — so the skip is opted into here, visibly in the log.
      DSH_ALLOW_SCHEMA_SKIP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # Nothing here pushes, and the release job installs an external dependency tree
          # afterwards: do not leave the checkout token in the local git config.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.4
        with:
          node-version: ${{ matrix.node }}
      # The plugin still has no runtime dependencies, but `npm test` now builds the
      # half the Harness loads — `pretest` runs `tsc` — so the pinned toolchain is
      # installed here. `--include=dev` is not decorative: npm omits devDependencies
      # whenever `NODE_ENV=production`, and that install exits 0 having installed
      # nothing, which reads as success right up until `tsc` is not found. There is
      # still no `npm ci`: this repository deliberately commits no lockfile.
      - name: Install the pinned toolchain
        run: npm install --include=dev --no-audit --no-fund
      - name: Offline suites and repository checks
        run: npm test

  # The gap the matrix cannot close. `npm test` compiles the runtime — `pretest` runs
  # `tsc -p tsconfig.json` — but the suites and the scripts are never compiled: Node
  # erases their types as it loads them, and erasing is not checking. A mistyped test
  # therefore passes every leg above and fails only `npm run typecheck`.
  #
  # One leg rather than seven: the compiler reads the same files and the same pinned
  # `@types/node` wherever it runs, so the other six would repeat a single answer. It
  # runs on the floor because that is also the version the release job publishes from,
  # and that job runs this same command before it publishes.
  typecheck:
    name: Type-check the runtime, the tests and the scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # Nothing here pushes, and the release job installs an external dependency tree
          # afterwards: do not leave the checkout token in the local git config.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.4
        with:
          node-version: '22.19.0'
      # The same exact-pinned toolchain the matrix installs, for the same reason: the
      # type checker is a devDependency, and an install that omits it exits 0.
      - name: Install the pinned toolchain
        run: npm install --include=dev --no-audit --no-fund
      - name: Type-check the whole repository
        run: npm run typecheck

  # One leg per dsh version this plugin declares support for. The list is read out of the
  # declaration rather than copied beside it: a second copy is a thing that drifts, and a
  # target nobody installs is a claim rather than a check.
  targets:
    name: The declared dsh targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      # `peerDependencies` is a `||` list of exact versions and a matrix wants JSON.
      # Versions are spelled out there rather than written as a range because the
      # platform ships prereleases, and semver's `^` does not cross them:
      # `^0.1.7-rc.2` stops below `0.2.0-rc.2`, so a caret would have refused the very
      # runtime this job exists to prove.
      - id: read
        shell: bash
        run: |
          node -e 'const p = require("./package.json").peerDependencies["@deepseek-ai/dsh"]; console.log("versions=" + JSON.stringify(p.split("||").map((v) => v.trim())))' >> "$GITHUB_OUTPUT"

  schema:
    name: Schema contract against dsh ${{ matrix.dsh }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every declared version is a promise to a user, so each one has to be reported.
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.targets.outputs.versions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # Nothing here pushes, and the release job installs an external dependency tree
          # afterwards: do not leave the checkout token in the local git config.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.4
        with:
          # The floor, deliberately: this job installs the Harness for real, so it is
          # also the place that proves the install works on the oldest Node the
          # plugin claims — which is the same Node the release job publishes from.
          node-version: '22.19.0'
      - uses: ./.github/actions/install-harness
        with:
          dsh-version: ${{ matrix.dsh }}
      - name: Conformance against the Harness's own validators
        run: npm run test:schema